name: Publish personal subpath image

on:
  push:
    branches: [build/subpath-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-subpath-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zakka258/snapotter
  SOURCE_COMMIT: 7dc321c65103d8ac62ff75e7e1b9d7081a70047f

jobs:
  build:
    if: github.repository == 'zakka258/SnapOtter'
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:subpath-${{ env.SOURCE_COMMIT }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/snapotter-hq/snapotter:cache-linux-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/zakka258/SnapOtter
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.description=SnapOtter with runtime BASE_PATH support
      - name: Verify embedded boot and subpath routes
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="${IMAGE}:subpath-${SOURCE_COMMIT}-${ARCH}"
          docker run -d --name snapotter-publish-smoke \
            -p 127.0.0.1::1349 \
            -e BASE_PATH=/snapotter \
            -e DEFAULT_PASSWORD="$(openssl rand -hex 24)" \
            "$image"
          trap 'docker logs --tail 100 snapotter-publish-smoke; docker rm -fv snapotter-publish-smoke' EXIT
          export ORIGIN="http://$(docker port snapotter-publish-smoke 1349/tcp)"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin = process.env.ORIGIN;
          let healthy = false;
          for (let attempt = 0; attempt < 120; attempt++) {
            try {
              const response = await fetch(`${origin}/snapotter/api/v1/health`, { signal: AbortSignal.timeout(5000) });
              if (response.ok && (await response.json()).status === 'healthy') { healthy = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert.ok(healthy, 'Container did not become healthy');
          assert.equal((await fetch(`${origin}/api/v1/health`)).status, 200);
          const html = await (await fetch(`${origin}/snapotter/image/resize`)).text();
          assert.ok(html.includes('<base href="/snapotter/"'), 'Missing runtime base path');
          const entry = html.match(/<script[^>]*src="([^"]+)"/)[1];
          assert.equal((await fetch(new URL(entry, `${origin}/snapotter/`))).status, 200);
          const manifest = await (await fetch(`${origin}/snapotter/manifest.json`)).json();
          assert.equal(new URL(manifest.start_url, `${origin}/snapotter/manifest.json`).pathname, '/snapotter/');
          const auth = await (await fetch(`${origin}/snapotter/api/v1/config/auth`)).json();
          assert.equal(auth.authEnabled, true);
          assert.equal((await fetch(`${origin}/snapotter/api/not-found`)).status, 404);
          console.log('Production container health, auth configuration, assets, manifest, and deep links passed');
          JS
      - name: Push verified platform image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE}:subpath-${SOURCE_COMMIT}-${ARCH}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:subpath" \
            --tag "${IMAGE}:subpath-${SOURCE_COMMIT}" \
            "${IMAGE}:subpath-${SOURCE_COMMIT}-amd64" \
            "${IMAGE}:subpath-${SOURCE_COMMIT}-arm64"
          docker buildx imagetools inspect "${IMAGE}:subpath"
          echo "Published \`${IMAGE}:subpath\` from \`${SOURCE_COMMIT}\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
